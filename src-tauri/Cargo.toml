[package]
name = "MBTilesViewer"
version = "1.9.2"
description = "MBtiles viewer and inspector"
authors = [ "dev@akylasfr" ]
license = "MIT"
repository = "https://github.com/farfromrefug/mbview"
default-run = "MBTilesViewer"
edition = "2021"
rust-version = "1.77.2"
build = "src/build.rs"
include = [ "**/*.rs" ]

[build-dependencies]
tauri-build = { version = "2.6", features = [ ] }

[dependencies]
r2d2 = "0.8"
r2d2_sqlite = "0.35"
flate2 = "1.0"
regex = "1.9"
lazy_static = "1.4"
serde_json = "1.0"
md5 = "0.7"
http-body-util = "0.1"
bytes = "1.5"
hyper-util = { version = "0.1", features = [ "tokio", "server", "http1", "http2" ] }
hotwatch = "0.5"
tokio = { version = "1.32", features = [ "full" ] }
hyper = { version = "1.1", features = [ "server", "http1", "http2" ] }
serde = { version = "1.0", features = [ "derive" ] }
tauri = { version = "2.11", features = [ "protocol-asset" ] }
tauri-plugin-window-state = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-opener = "2.5"

  [dependencies.rusqlite]
  version = "0.40"
  features = [ "bundled" ]

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

[profile.dev.package."*"]
opt-level = 2
