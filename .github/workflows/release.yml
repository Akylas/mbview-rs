name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How to bump the version'
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: 'Work out the next version and stop, without tagging or building'
        type: boolean
        default: false

# a second release starting while one is mid-tag would fight over the same
# branch, so they queue instead
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Only for a manual run: bump, changelog, commit and tag. A tag push skips
  # this and goes straight to reading the changelog.
  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # standard-version reads the tag history to work out the next version
          fetch-depth: 0

      - name: Node.js enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install deps
        run: yarn install --immutable --silent

      - name: Bump version and changelog
        id: bump
        env:
          # `auto` lets conventional commits decide; the rest force a level
          RELEASE_TYPE: ${{ inputs.release_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          args="--commit-all"
          if [ "$RELEASE_TYPE" != "auto" ]; then
            args="$args --release-as $RELEASE_TYPE"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            yarn standard-version $args --dry-run
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-git-tag-version so we don't create the tag yet; the tag and
          # commit are pushed only after a successful build (see `publish` job).
          yarn standard-version $args --skip.tag --skip.commit
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Prepared v$version (will commit and tag after successful build)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload version bump as artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: version-bump
          # Upload every file that standard-version touched so the publish job
          # can apply them before committing.
          path: |
            package.json
            CHANGELOG.md
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock

  changelog:
    needs: [version]
    # `version` is skipped on a tag push, which would skip this too
    if: ${{ !cancelled() && !failure() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.resolve.outputs.version }}
      TAG: ${{ steps.resolve.outputs.tag }}
      CHANGELOG: ${{ steps.changelog_reader.outputs.changes }}
      STATUS: ${{ steps.changelog_reader.outputs.status }}
    steps:
      - name: Resolve the version being released
        id: resolve
        env:
          BUMPED: ${{ needs.version.outputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$BUMPED"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$version" ]; then
            echo "no version to release" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Changelog Entry
        id: changelog_reader
        uses: Akylas/changelog-reader-action@v2
        with:
          version: ${{ steps.resolve.outputs.version }}
          path: ./CHANGELOG.md

  build-tauri:
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest' # oldest glibc we support for the AppImage/deb bundles
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply version bump artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: version-bump
          # Overwrite the checked-out files with the bumped versions so the
          # build uses the correct version numbers.
          path: .

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - name: Node.js enable corepack
        run: corepack enable

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install deps
        run: yarn install --immutable --silent

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IDENTITY_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ needs.changelog.outputs.TAG }}
          releaseName: ${{ needs.changelog.outputs.TAG }}
          releaseBody: ${{ needs.changelog.outputs.CHANGELOG }}
          releaseDraft: false
          prerelease: ${{ needs.changelog.outputs.STATUS == 'prereleased' }}

  # If any build matrix leg fails, delete the (partially-created) GitHub release
  # so we don't leave a broken release behind.
  cleanup-release:
    if: ${{ failure() && needs.build-tauri.result != 'skipped' }}
    needs: [changelog, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete failed release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.changelog.outputs.TAG }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

  # Commit and push the version bump only after every build matrix leg succeeds.
  # If any build fails this job is skipped and the repo is left untouched.
  publish:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    needs: [changelog, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download version bump artifact
        uses: actions/download-artifact@v4
        with:
          name: version-bump
          path: .

      - name: Commit, tag and push
        env:
          VERSION: ${{ needs.changelog.outputs.VERSION }}
          TAG: ${{ needs.changelog.outputs.TAG }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): $TAG"
          git tag "$TAG"
          git push --follow-tags origin "HEAD:${GITHUB_REF_NAME}"
          echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
