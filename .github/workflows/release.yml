name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'How much to bump the version. `auto` reads the conventional commits since the last tag and decides.'
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    # a manual run writes the release commit and tag back to the branch
    permissions:
      contents: write
    outputs:
      RELEASE_UPLOAD_ID: ${{ steps.create_release.outputs.id }}
      RELEASE_TAG: v${{ steps.changelog_reader.outputs.version }}
      # SHA before standard-version ran; used by the cleanup job to undo on failure
      PRE_BUMP_SHA: ${{ steps.pre_bump.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          # standard-version reads the tags and the commits since the last one
          # to work out an `auto` bump, and there is nothing to read in a
          # shallow clone
          fetch-depth: 0

      # A tag push arrives with the version already decided and written down. A
      # manual run has neither, so it cuts the release here: standard-version
      # bumps src-tauri/Cargo.toml — see .versionrc.js, that file is where this
      # project keeps its version — writes the CHANGELOG entry the next step
      # goes looking for, commits and tags.
      #
      # Pushing with GITHUB_TOKEN does not start another workflow run, so the
      # `v*` tag this creates cannot set the whole thing going a second time.
      #
      # standard-version is configured by .versionrc.js, which pulls in
      # tauriVersioner.js, which pulls in @tauri-apps/toml — all of it resolved
      # from the repository, none of it from wherever the CLI itself was
      # fetched. So the project's own dependencies go in first and the CLI is
      # run out of them, at the version package.json pins.
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install deps
        run: yarn install --immutable --silent

      - name: Record pre-bump commit SHA
        id: pre_bump
        if: github.event_name == 'workflow_dispatch'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cut the release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          # through the environment rather than inlined into the script: an
          # input is whatever the person who started the run chose
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --commit-all: the postchangelog hook in .versionrc.js writes the
          # F-Droid changelog for the new versionCode, and standard-version only
          # stages the files it bumped itself. The checkout is clean, so there is
          # nothing else for it to pick up.
          if [ "$BUMP" = auto ]; then
            yarn standard-version --commit-all
          else
            yarn standard-version --commit-all --release-as "$BUMP"
          fi
          git push --follow-tags origin "HEAD:$GITHUB_REF_NAME"

      - name: Work out which version is being released
        id: tag_name
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            # a tag push says so itself
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            # otherwise it is the tag the step above just wrote
            *) version=$(git describe --tags --abbrev=0) ;;
          esac
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "no version on the ref and no tag to read one off" >&2
            exit 1
          fi
          echo "releasing $version"
          # `set-output` was turned off on the runners in 2023
          echo "current_version=$version" >> "$GITHUB_OUTPUT"

      - name: Get Changelog Entry
        id: changelog_reader
        # upstream rather than the fork: the fork is still a node12 action, and
        # the runners no longer have a node that old
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./CHANGELOG.md

      - name: create release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # This pulls from the "Get Changelog Entry" step above, referencing it's ID to get its outputs object.
          # See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          tag: v${{ steps.changelog_reader.outputs.version }}
          name: v${{ steps.changelog_reader.outputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          # we create first the release as draft. Will be published once everything is done
          draft: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          # the tag, not the commit the run started from: a manual run bumps
          # the version after that commit, and the bundles carry it
          ref: ${{ needs.create-release.outputs.RELEASE_TAG }}

      # Tauri v2 links against the 4.1 webkit2gtk, not the 4.0 the v1 template
      # installed, and against the ayatana fork of libappindicator
      - name: Install webkit2gtk (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install autotools (macOS only)
        if: matrix.platform == 'macos-latest'
        run: brew install autoconf automake libtool

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install deps
        run: yarn install --immutable --silent

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IDENTITY_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        with:
          releaseId: ${{ needs.create-release.outputs.RELEASE_UPLOAD_ID }}

  update-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    if: ${{ always() && needs.create-release.result == 'success' && needs.build-tauri.result == 'success' }}
    steps:
      - name: Publish release as latest
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.create-release.outputs.RELEASE_TAG }}
          draft: false
          makeLatest: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true

  # If any build job fails, delete the draft release and clean up the tag. For
  # workflow_dispatch runs, also revert the version-bump commit that was already
  # pushed. Tag-push runs have nothing to revert, but we still want the draft
  # release and the tag gone so the version can be re-released later.
  cleanup-on-failure:
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    if: >-
      ${{ always()
          && needs.create-release.result == 'success'
          && (needs.build-tauri.result == 'failure') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete tag and revert version bump commit (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && needs.create-release.outputs.PRE_BUMP_SHA != ''
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.RELEASE_TAG }}
          PRE_BUMP_SHA: ${{ needs.create-release.outputs.PRE_BUMP_SHA }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Delete the tag remotely (ignore error if it was never pushed or already gone)
          git push --delete origin "$RELEASE_TAG" || true
          # Force-reset the branch to the commit before standard-version ran
          git push --force origin "$PRE_BUMP_SHA:$GITHUB_REF_NAME"
      - name: Delete tag (tag-push only)
        if: github.event_name != 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # Delete the tag remotely (ignore error if it was never pushed or already gone)
          git push --delete origin "$RELEASE_TAG" || true
      - name: Delete the draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="${{ needs.create-release.outputs.RELEASE_UPLOAD_ID }}"
          if [ -n "$release_id" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" || true
          fi
